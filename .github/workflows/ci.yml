name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as one job: the native Manim prerequisites make a second job's
  # apt and sync cost far more than the commit-stage hooks it would save
  # across a two-version matrix.
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            python3-dev

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --dev

      - name: Run commit hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.4.x"

      - name: Run push-stage hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.4.x"
          extra-args: --all-files --hook-stage pre-push

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Install smoke test
        if: matrix.python-version == '3.12'
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/manim-tutorial" --help
